[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmn-procedure-generator"
version = "0.1.0"
description = "Semantic BPMN parser and procedure document generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "python-docx>=1.1,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bpmn"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
